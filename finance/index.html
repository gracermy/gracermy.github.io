<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom · gracermy</title>
<meta name="robots" content="noindex, nofollow">

<!-- Installable web app (PWA). Adding Bloom to the Home Screen gives it an
     icon, a full-screen launch, and — on iOS — the ability to receive push
     notifications, which Apple allows ONLY for home-screen installs. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fbeef0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#160d13" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<!-- iOS ignores the manifest's icon and display fields; it needs these. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bloom">

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Source+Sans+3:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="container">
    <div class="nav-left">
      <a href="/" class="nav-logo" id="navLogo">gracermy</a>
      <div class="nav-links" id="navRight">
        <button id="signOutBtn" title="Sign out">Sign out</button>
      </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle dark/light mode">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
  </div>
</nav>

<main>
  <div class="container">
    <div id="app"><!-- rendered by app.js --></div>
  </div>
</main>

<footer>
  <div class="container">
    <p>Bloom · made with love by @gracermy</p>
  </div>
</footer>

<!-- Theme toggle (shared with the rest of the site) -->
<script src="/theme.js"></script>

<!-- Supabase JS SDK (public CDN; fine on a normal hosted page) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- App config: copy config.sample.js -> config.js and fill in your values.
     config.sample.js is only a template and is NOT loaded here. If config.js
     is missing, the app shows a setup screen. -->
<script src="config.js" onerror="window.__noConfig=true"></script>

<!-- App modules -->
<script src="supabase.js"></script>
<script src="snapshot.js"></script>
<script src="charts.js"></script>
<script src="statements.js"></script>
<script src="split.js"></script>
<script src="app.js"></script>

<!-- Register the service worker. Wrapped in every guard that matters: it only
     runs on HTTPS (or localhost), and a failure here must never stop the app
     from working — a PWA that won't install is a missing convenience, but a
     crash on load is a broken app. -->
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
