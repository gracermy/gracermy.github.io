function makeQuery(table){
  const api={_rows:(TABLES[table]||[]).slice(),
    select(){return api;}, eq(c,v){api._rows=api._rows.filter(r=>r[c]===v);return api;}, order(){return api;},
    maybeSingle(){return Promise.resolve({data:api._rows[0]||null,error:null});},
    single(){return Promise.resolve({data:api._rows[0]||null,error:null});},
    insert(){return {select:()=>({single:()=>Promise.resolve({data:{id:'new'},error:null})}),then:(f)=>f({error:null})};},
    update(){return {eq:()=>Promise.resolve({error:null})};},
    delete(){return {eq:()=>Promise.resolve({error:null})};},
    upsert(){return Promise.resolve({error:null});},
    then(f){return Promise.resolve({data:api._rows,error:null}).then(f);}};

}

<script>
// Preview: Perks runs against in-memory data and a fake resolver, so the
// add/confirm flow is fully clickable without a login or an API call.
(function(){
  if(!window.Perks) return;
  let CARDS=[
    {id:'p1', kind:'card', typed_name:'hang seng enjoy', name:'Hang Seng enJoy Card', issuer:'Hang Seng Bank',
     tier:null, status:'confirmed', official_url:'https://www.hangseng.com/', resolved_at:new Date().toISOString(), sort_order:0},
    {id:'p2', kind:'card', typed_name:'mox', name:'Mox Credit', issuer:'Mox Bank',
     tier:'Mox+', status:'confirmed', official_url:'https://mox.com/', resolved_at:new Date().toISOString(), sort_order:1},
    {id:'p3', kind:'card', typed_name:'that blue one', name:'that blue one', issuer:null,
     tier:null, status:'unverified', official_url:null, resolved_at:null, sort_order:2},
    {id:'p4', kind:'membership', typed_name:'yuu', name:'yuu Rewards Club', issuer:'DFI Retail Group',
     tier:null, status:'confirmed', official_url:'https://www.yuurewards.com/', resolved_at:new Date().toISOString(), sort_order:3},
  ];
  Perks.loadCards=async()=>JSON.parse(JSON.stringify(CARDS));
  // Offers shaped exactly like the gather function returns: real requirements,
  // a source link on each, one already expired, one tier-specific.
  const now=new Date(), iso=d=>d.toISOString().slice(0,10);
  const past=new Date(now); past.setDate(past.getDate()-20);
  const soon=new Date(now); soon.setDate(soon.getDate()+45);
  let OFFERS=[
    {id:'o1',card_id:'p1',merchant:'Wellcome',headline:'8% off on the 3rd, 13th and 23rd',
     detail:'Applies at Wellcome and Market Place stores across Hong Kong.',
     requirements:'Single net spend of HK$100 or above in store; HK$600 or above for online delivery. Excludes delivery and packaging charges.',
     tier:null,starts_on:null,ends_on:null,source_url:'https://www.wellcome.com.hk/',gathered_at:now.toISOString()},
    {id:'o2',card_id:'p1',merchant:'Mannings',headline:'Up to 8% off on designated days',
     detail:null,requirements:'Min HK$100 net spend. Excludes prescription medicine and gift vouchers.',
     tier:null,starts_on:null,ends_on:null,source_url:'https://www.hangseng.com/',gathered_at:now.toISOString()},
    {id:'o3',card_id:'p2',merchant:'Supermarkets',headline:'3% unlimited cashback',
     detail:'Applies at merchants classified under Grocery Stores / Supermarkets.',
     requirements:'None stated. Merchant category is set by the card network, not by Mox.',
     tier:null,starts_on:null,ends_on:null,source_url:'https://mox.com/features/mox-credit/',gathered_at:now.toISOString()},
    {id:'o4',card_id:'p2',merchant:'Any merchant',headline:'2% unlimited cashback with Mox+',
     detail:'From 1 September 2026 the base rate depends on Mox+ status.',
     requirements:'Requires an active Mox+ subscription. Without Mox+ the rate is 1%.',
     tier:'Mox+',starts_on:'2026-09-01',ends_on:null,source_url:'https://mox.com/',gathered_at:now.toISOString()},
    {id:'o5',card_id:'p4',merchant:'7-Eleven',headline:'Double yuu Points weekends',
     detail:null,requirements:'Scan the yuu app before paying. Points cap of 2,000 per month.',
     tier:null,starts_on:null,ends_on:iso(soon),source_url:'https://www.yuurewards.com/',gathered_at:now.toISOString()},
    {id:'o6',card_id:'p1',merchant:'IKEA',headline:'5% back on furniture',
     detail:null,requirements:'Min spend HK$500. Was a limited campaign.',
     tier:null,starts_on:null,ends_on:iso(past),source_url:'https://www.hangseng.com/',gathered_at:now.toISOString()},
  ];
  Perks.loadOffers=async()=>JSON.parse(JSON.stringify(OFFERS));
  Perks.gatherFor=async(c)=>{await new Promise(r=>setTimeout(r,600));return {offers:[],notes:null};};
  Perks.replaceOffers=async()=>[];
  Perks.addCards=async(rows)=>{rows.forEach((r,i)=>CARDS.push({...r,id:'n'+(CARDS.length+i)}));return rows;};
  Perks.updateCard=async(id,patch)=>{const c=CARDS.find(x=>x.id===id); if(c)Object.assign(c,patch);};
  Perks.deleteCard=async(id)=>{CARDS=CARDS.filter(x=>x.id!==id);};
  // Mirrors the real resolver: one exact match, one genuinely ambiguous pair,
  // one with tiers, and one it cannot identify.
  Perks.resolve=async(entries)=>{
    await new Promise(r=>setTimeout(r,500));
    return entries.map(t=>{
      const k=t.toLowerCase();
      if(k.includes('enjoy')) return {typed:t,kind:'card',candidates:[
        {name:'Hang Seng enJoy Card',issuer:'Hang Seng Bank',tiers:[],
         distinguisher:'8% off at Wellcome and Mannings on the 3rd, 13th and 23rd; min HK$100 in store.',
         official_url:'https://www.hangseng.com/',confidence:'high'},
        {name:'enJoy Visa Platinum Card',issuer:'Hang Seng Bank',tiers:[],
         distinguisher:'Same yuu earning, plus Visa Platinum travel and dining privileges.',
         official_url:'https://www.hangseng.com/',confidence:'medium'}]};
      if(k.includes('mox')) return {typed:t,kind:'card',candidates:[
        {name:'Mox Credit',issuer:'Mox Bank',tiers:['Mox+','No Mox+'],
         distinguisher:'3% at supermarkets for everyone; from 1 Sep 2026, 2% elsewhere with Mox+ and 1% without.',
         official_url:'https://mox.com/',confidence:'high'}]};
      if(k.includes('yuu')) return {typed:t,kind:'membership',candidates:[
        {name:'yuu Rewards Club',issuer:'DFI Retail Group',tiers:[],
         distinguisher:'Points across Wellcome, Mannings, 7-Eleven, IKEA and KFC.',
         official_url:'https://www.yuurewards.com/',confidence:'high'}]};
      return {typed:t,kind:'card',candidates:[]};
    });
  };
})();
</script>
